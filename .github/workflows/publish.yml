name: Publish

on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: 'Optional preview.N (unused and at least the next preview). Empty selects automatically.'
        type: string
        default: ''
      dry-run:
        description: Validate and attach packages without pushing to the feed
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry-run }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require a NuGet.org API key
        if: env.DRY_RUN != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_TOKEN || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Publishing to nuget.org needs the NUGET_TOKEN or NUGET_API_KEY repository secret."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: node eng/resolve-preview-version.mjs

      - name: Build
        run: |
          dotnet build Broiler.Hosting.slnx -c Release --nologo -p:Version=${{ steps.version.outputs.version }} -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Test
        timeout-minutes: 15
        shell: pwsh
        run: ./eng/run-tests.ps1 -Configuration Release

      - name: Pack and verify every package
        shell: pwsh
        run: ./eng/pack.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error

      - name: Verify consumer restore from the destination feed
        shell: pwsh
        run: ./eng/verify-feed.ps1 -Target nuget

      - name: Push to NuGet.org
        if: env.DRY_RUN != 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_TOKEN || secrets.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -Path artifacts -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw "No .nupkg packages found in artifacts directory."
          }
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Summary
        run: |
          {
            echo "### Broiler.Hosting ${{ steps.version.outputs.version }}"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo 'Dry run: validated packages are attached; nothing was pushed.'
            else
              echo 'Published to NuGet.org.'
            fi
            echo
            echo '```'
            ls -1 artifacts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
